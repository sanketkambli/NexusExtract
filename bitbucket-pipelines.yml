image: mcr.microsoft.com/dotnet/sdk:10.0

pipelines:
  pull-requests:
    '**':
      - step:
          name: '.NET 10 Automated Testing & Build Validation'
          caches:
            - dotnetcore
          script:
            - dotnet restore NexusExtractGateway.sln
            - dotnet build NexusExtractGateway.sln --configuration Release --no-restore
            - dotnet test tests/NexusExtract.UnitTests/NexusExtract.UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"
          artifacts:
            - "**/test_results.trx"

      - step:
          name: 'React 19 Frontend Lint & Unit Tests'
          image: node:22-alpine
          caches:
            - node
          script:
            - cd client
            - npm ci
            - npm run test -- --passWithNoTests
            - npm run build

  branches:
    main:
      - step:
          name: '.NET 10 Build & Unit Test Verification'
          caches:
            - dotnetcore
          script:
            - dotnet restore NexusExtractGateway.sln
            - dotnet build NexusExtractGateway.sln --configuration Release --no-restore
            - dotnet test tests/NexusExtract.UnitTests/NexusExtract.UnitTests.csproj --configuration Release --no-build

      - step:
          name: 'Security Scan (Trivy Vulnerability Scanner)'
          image: aquasec/trivy:latest
          script:
            - trivy fs --security-checks vuln,config --severity HIGH,CRITICAL .

      - step:
          name: 'Build & Push Docker Containers to Google Artifact Registry'
          services:
            - docker
          script:
            - echo $GCP_SERVICE_KEY | docker login -u _json_key --password-stdin https://us-central1-docker.pkg.dev
            - docker build -t us-central1-docker.pkg.dev/$GCP_PROJECT_ID/nexus-repo/nexus-api:$BITBUCKET_COMMIT -f Dockerfile.api .
            - docker build -t us-central1-docker.pkg.dev/$GCP_PROJECT_ID/nexus-repo/nexus-worker:$BITBUCKET_COMMIT -f Dockerfile.worker .
            - docker push us-central1-docker.pkg.dev/$GCP_PROJECT_ID/nexus-repo/nexus-api:$BITBUCKET_COMMIT
            - docker push us-central1-docker.pkg.dev/$GCP_PROJECT_ID/nexus-repo/nexus-worker:$BITBUCKET_COMMIT

      - step:
          name: 'Terraform Infrastructure Provisioning & Cloud Run Deployment'
          image: hashicorp/terraform:1.7
          script:
            - cd terraform
            - terraform init
            - terraform plan -var="project_id=$GCP_PROJECT_ID" -var="api_container_image=us-central1-docker.pkg.dev/$GCP_PROJECT_ID/nexus-repo/nexus-api:$BITBUCKET_COMMIT" -var="worker_container_image=us-central1-docker.pkg.dev/$GCP_PROJECT_ID/nexus-repo/nexus-worker:$BITBUCKET_COMMIT" -out=tfplan
            - terraform apply -auto-approve tfplan
